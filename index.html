<html lang="en">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#F8FAFB" />

    <link rel="preload" href="/fonts/BDOGrotesk-Regular.woff2" as="font" type="font/woff2" crossorigin />

    <title>Naufal Aziz · Full-Stack Developer</title>
    <script>
      // apply the saved theme before first paint
      try {
        if (JSON.parse(localStorage.getItem("theme") || "\"light\"") === "dark") document.documentElement.classList.add("dark");
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("motion-ok");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
